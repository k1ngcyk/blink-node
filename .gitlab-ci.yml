stages: [build]

build-and-publish:
  stage: build
  tags: [build]
  resource_group: blink-node-release
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - bash deploy/ci.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/public/downloads/agent/
      - .local/docker-*/verification.json
      - .local/publish-metadata.json
