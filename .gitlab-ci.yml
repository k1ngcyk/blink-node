stages: [build, deploy]
workflow:
  auto_cancel:
    on_new_commit: interruptible

build-and-publish:
  stage: build
  tags: [build]
  resource_group: blink-node-release
  timeout: 1h
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - bash deploy/ci.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/public/downloads/agent/
      - .local/publish-metadata.json

deploy-production:
  stage: deploy
  tags: [blink-master-deploy]
  needs:
    - job: build-and-publish
      artifacts: false
  resource_group: blink-node-production
  timeout: 20m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://node.withblink.com
    deployment_tier: production
  script:
    - bash deploy/ci-deploy.sh
